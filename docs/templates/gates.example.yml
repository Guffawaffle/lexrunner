# Example .smartergpt/gates.yml for Lex Ecosystem Repos
# Copy this file to your repository and customize for your project

# Schema version
schemaVersion: "1.0.0"

# Quality gates to run before merge-weave
gates:
  # Linting gate
  - name: lint
    description: "Run code linting to ensure code quality standards"
    run: npm run lint
    required: true
    retries: 0
    continueOnError: false

  # Type checking gate (for TypeScript projects)
  - name: typecheck
    description: "Verify TypeScript type safety"
    run: npm run typecheck
    required: true
    retries: 0
    continueOnError: false

  # Unit tests gate
  - name: test
    description: "Run unit test suite"
    run: npm test
    required: false # Set to true to make tests mandatory for merge
    retries: 1 # Retry once if tests fail (for flaky tests)
    continueOnError: false

  # Build gate (optional)
  # - name: build
  #   description: "Verify project builds successfully"
  #   run: npm run build
  #   required: false
  #   retries: 0
  #   continueOnError: false

  # Integration tests gate (optional)
  # - name: integration
  #   description: "Run integration tests"
  #   run: npm run test:integration
  #   required: false
  #   retries: 0
  #   continueOnError: false

  # Security audit gate (optional)
  # - name: audit
  #   description: "Run security dependency audit"
  #   run: npm audit --audit-level=high
  #   required: false
  #   retries: 0
  #   continueOnError: true  # Don't fail on audit warnings

# Gate execution policy
policy:
  # Run gates in parallel when possible
  parallel: true

  # Maximum concurrent gates (null = unlimited)
  maxWorkers: 2

  # Fail fast - stop on first gate failure
  failFast: true

  # Required gates must pass for merge eligibility
  strictRequired: true

# Gate environment configuration
environment:
  # Environment variables to set for all gates
  vars:
    NODE_ENV: test
    CI: "true"

  # Working directory for gate execution (relative to repo root)
  # workingDir: .

  # Shell to use for running commands
  shell: bash

# Reporting configuration
reporting:
  # Generate detailed gate reports
  verbose: false

  # Artifact directory for gate outputs
  artifactDir: .smartergpt.local/runner/artifacts

  # Save gate logs
  saveLogs: true

  # Log format: json | text
  logFormat: json

# Notes:
# - Gates run in the order defined unless parallel: true
# - Required gates must pass for merge eligibility
# - Timeout is in milliseconds
# - Retries: 0 = run once, 1 = retry once on failure
# - continueOnError: true = log failure but don't block merge
