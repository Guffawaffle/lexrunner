# Minimal CI: lint + typecheck only
# To run full CI: use workflow_dispatch with 'level' input
# Local equivalents:
#   minimal: npm run ci:minimal
#   standard: npm run ci
#   full: npm run ci:full
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/**'
      - 'vitest.config.ts'
      - 'tsup.config.ts'
  workflow_dispatch:
    inputs:
      level:
        description: 'CI level to run'
        required: false
        type: choice
        options:
          - minimal
          - standard
          - full
        default: 'minimal'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  # Setup job - install dependencies once, cache for all jobs
  setup:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

  # Minimal gates: lint + typecheck (always runs)
  lint:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run typecheck

  # Standard gates: build + tests (only on workflow_dispatch with level >= standard)
  build-and-test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: >-
      github.event_name == 'workflow_dispatch' && 
      (inputs.level == 'standard' || inputs.level == 'full')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run build
      - run: npm test
      - run: npm run validate:manifests

  # Full gates: determinism + license (only on workflow_dispatch with level == full)
  determinism-and-license:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.level == 'full'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run build
      - run: npm run format
      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "❌ Repository is not clean after build and format"
            exit 1
          fi
          echo "✅ Repository is clean"
      - name: Determinism smoke test
        run: |
          rm -rf .artifactsA .artifactsB
          node dist/cli.js plan --out .artifactsA
          node dist/cli.js plan --out .artifactsB
          diff -u .artifactsA/plan.json .artifactsB/plan.json
          echo "✅ Plan generation is deterministic"
      - name: License compliance
        run: node scripts/check-license-compliance.mjs

  # Summary job
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed"; exit 1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "❌ TypeCheck failed"; exit 1
          fi
          echo "✅ CI Complete (level: ${{ inputs.level || 'minimal' }})"
