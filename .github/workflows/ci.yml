name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/**'
      - 'vitest.config.ts'
      - 'tsup.config.ts'
  workflow_dispatch:
    inputs:
      run_determinism_check:
        description: 'Run determinism verification (expensive)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  # Stage 0: Verify Commit Signatures (MANDATORY)
  verify-signatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to check all commits

      - name: Import GPG keys from repository secrets
        run: |
          # Import trusted GPG public keys (add to repo secrets)
          echo "${{ secrets.TRUSTED_GPG_KEYS }}" | base64 -d | gpg --import
        continue-on-error: true  # Allow if no secrets configured yet

      - name: Verify commit signatures
        run: |
          # Get the range of commits to verify
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            COMMIT_RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            # For push events, check the pushed commits
            COMMIT_RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          echo "Verifying commits in range: $COMMIT_RANGE"

          # Check each commit for signature
          UNSIGNED_COMMITS=$(git log --show-signature --format="%H %s" $COMMIT_RANGE 2>&1 | \
            grep -B1 "No signature" | grep -E "^[0-9a-f]{40}" | cut -d' ' -f1 || true)

          if [ -n "$UNSIGNED_COMMITS" ]; then
            echo "❌ ERROR: The following commits are NOT signed:"
            echo "$UNSIGNED_COMMITS" | while read commit; do
              git log --format="%H %an <%ae> %s" -n 1 $commit
            done
            echo ""
            echo "All commits MUST be GPG-signed. Please see CONTRIBUTING.md for setup instructions."
            echo "To sign commits: git commit --amend -S --no-edit && git push --force-with-lease"
            exit 1
          fi

          echo "✅ All commits are properly signed."

  # Setup job - install dependencies once, cache for all jobs
  setup:
    runs-on: ubuntu-latest
    needs: verify-signatures
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

  lint:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Build
        run: npm run build --if-present
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run build --if-present

  determinism:
    runs-on: ubuntu-latest
    needs: [verify-signatures, setup]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name == 'workflow_dispatch' && inputs.run_determinism_check || github.event_name == 'push')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run build --if-present
      - run: npm run format
      - name: Check for changes after build and format
        run: |
          if ! git diff --exit-code; then
            echo "❌ Repository is not clean after build and format"
            echo "The following files have changes:"
            git diff --name-only
            echo ""
            echo "Please run 'npm run build && npm run format' locally and commit the changes."
            exit 1
          else
            echo "✅ Repository is clean after build and format"
          fi
      - name: Determinism smoke test - compare two plan runs
        run: |
          rm -rf .artifactsA .artifactsB
          node dist/cli.js plan --out .artifactsA
          node dist/cli.js plan --out .artifactsB
          if ! diff -u .artifactsA/plan.json .artifactsB/plan.json; then
            echo "❌ Plan output is not deterministic"
            exit 1
          fi
          if ! diff -u .artifactsA/snapshot.md .artifactsB/snapshot.md; then
            echo "❌ Snapshot output is not deterministic"
            exit 1
          fi
          echo "✅ Plan generation is deterministic"
