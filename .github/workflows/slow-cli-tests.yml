name: Slow CLI Tests

on:
  # Run on schedule (daily at 3:00 AM UTC)
  schedule:
    - cron: "0 3 * * *"
  # Manual trigger
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  LEX_ENABLE_SLOW_CLI_TESTS: "true"

jobs:
  slow-cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run slow CLI tests
        run: npm run test:cli:slow
