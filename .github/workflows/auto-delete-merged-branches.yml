name: Auto-delete merged PR branches

# Purpose: Automatically delete head branches after PR merge
# Scope: Only same-repo branches matching allowed prefixes (copilot/*, integration/umbrella-*)
# Safety: Ignores forks, protected branches, default branch, and PRs with 'keep-branch' label

on:
  pull_request:
    types: [closed]

permissions:
  contents: write  # Required to delete branches

jobs:
  delete-merged-branch:
    runs-on: ubuntu-latest
    # Only run if PR was actually merged (not just closed)
    if: github.event.pull_request.merged == true
    steps:
      - name: Check branch eligibility
        id: check
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          DEFAULT_BRANCH="${{ github.event.pull_request.base.repo.default_branch }}"
          HEAD_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          BASE_REPO="${{ github.repository }}"
          PR_LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'

          echo "Head branch: $HEAD_REF"
          echo "Default branch: $DEFAULT_BRANCH"
          echo "Head repo: $HEAD_REPO"
          echo "Base repo: $BASE_REPO"
          echo "PR labels: $PR_LABELS"

          # Safety check 1: Ignore forks
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "❌ Skipping: Head branch is from a fork ($HEAD_REPO)"
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "reason=fork" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Safety check 2: Never delete default branch
          if [ "$HEAD_REF" = "$DEFAULT_BRANCH" ]; then
            echo "❌ Skipping: Head branch is the default branch ($DEFAULT_BRANCH)"
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "reason=default-branch" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Safety check 3: Check for opt-out label
          if echo "$PR_LABELS" | grep -q '"keep-branch"'; then
            echo "❌ Skipping: PR has 'keep-branch' label"
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "reason=keep-branch-label" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Safety check 4: Only delete branches with allowed prefixes
          # Allowed prefixes: copilot/*, integration/umbrella-*, feature/*
          if [[ "$HEAD_REF" == copilot/* ]] || \
             [[ "$HEAD_REF" == integration/umbrella-* ]] || \
             [[ "$HEAD_REF" == feature/* ]]; then
            echo "✅ Eligible for deletion (matches allowed prefix)"
            echo "eligible=true" >> $GITHUB_OUTPUT
            echo "reason=allowed-prefix" >> $GITHUB_OUTPUT
          else
            echo "❌ Skipping: No matching prefix (copilot/*, integration/umbrella-*, feature/*)"
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "reason=no-matching-prefix" >> $GITHUB_OUTPUT
          fi

      - name: Delete branch
        if: steps.check.outputs.eligible == 'true'
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          echo "Deleting branch: $HEAD_REF"

          # Use GitHub CLI to delete the branch
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/git/refs/heads/$HEAD_REF" || {
              echo "⚠️ Failed to delete (may already be deleted or protected)"
              exit 0
            }

          echo "✅ Successfully deleted branch: $HEAD_REF"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log result
        if: always()
        run: |
          if [ "${{ steps.check.outputs.eligible }}" = "true" ]; then
            echo "✅ Branch deletion completed for: ${{ github.event.pull_request.head.ref }}"
          else
            echo "ℹ️ Branch not deleted. Reason: ${{ steps.check.outputs.reason }}"
          fi
